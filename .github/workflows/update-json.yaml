name: Update JSON every 2 hours

# Triggers: scheduled + manual
on:
  schedule:
    - cron: "0 */2 * * *" # every 2 hours
  workflow_dispatch: {} # manual trigger

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10.6" # adjust if needed

      # 3. Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run your Python script
      - name: Run backend script
        env:
          # Add any secrets needed, e.g., SPOTIFY_CLIENT_ID
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          STATE_FILE: ${{ secrets.STATE_FILE }}
          MANUAL_ENTRY_FILE: ${{ secrets.MANUAL_ENTRY_FILE }}
          GOOGLE_SHEETS_ENTRY_FILE: ${{ secrets.GOOGLE_SHEETS_ENTRY_FILE }}

        run: |
          python main.py

      # 5. Commit & push the updated JSON back to the repo
      - name: Commit and push JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/album_state.json
          git commit -m "Update JSON via GitHub Actions" || echo "No changes to commit"
          git push
